server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Если зайти сразу по ссылке вида /tickets/123 (не с главной) —
    # без этой строки nginx попытается найти файл "tickets/123" на
    # диске и выдаст 404. С ней — всегда отдаёт index.html, а
    # дальше уже React Router сам показывает нужную страницу.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
